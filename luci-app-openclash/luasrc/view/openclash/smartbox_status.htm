<%+header%>
<h2><%:SmartBox - Smart 节点质量排名%></h2>
<p><%:独立测试模式：以下数据来自 sing-box Smart 内核，不会改变 OpenClash 当前线路。排名需要真实连接数据积累。%></p>
<div id="smartbox-message" role="status"><em><%:正在读取 Smart 排名...%></em></div>
<pre id="smartbox-runtime" aria-live="polite"></pre>
<div id="smartbox-results"></div>
<p><button type="button" id="smartbox-refresh" class="btn cbi-button cbi-button-reload"><%:刷新排名%></button></p>
<h3><%:近期日志%></h3>
<pre id="smartbox-logs" aria-live="polite" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:24rem;overflow:auto"></pre>
<script type="text/javascript">
(function () {
  'use strict';
  var endpoint = '<%=luci.dispatcher.build_url("admin","services","smartbox","status_data")%>';
  var message = document.getElementById('smartbox-message');
  var runtime = document.getElementById('smartbox-runtime');
  var logs = document.getElementById('smartbox-logs');
  var target = document.getElementById('smartbox-results');
  var button = document.getElementById('smartbox-refresh');
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function put(parent, tag, value, cls) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = value === undefined || value === null ? '-' : String(value);
    parent.appendChild(el);
    return el;
  }
  function measurement(v, suffix) {
    return typeof v === 'number' && isFinite(v) && v > 0 ? v.toFixed(1) + suffix : '-';
  }
  function speed(bps) {
    if (typeof bps !== 'number' || !isFinite(bps) || bps <= 0) return '-';
    return (bps / 1048576).toFixed(2) + ' MiB/s';
  }
  function field(obj, names) {
    if (!obj) return undefined;
    for (var i = 0; i < names.length; i++) {
      if (obj[names[i]] !== undefined && obj[names[i]] !== null) return obj[names[i]];
    }
    return undefined;
  }
  function number(obj, names) {
    var value = field(obj, names);
    return typeof value === 'number' && isFinite(value) ? value : undefined;
  }
  function groupInfo(groups, name) {
    if (Array.isArray(groups)) {
      for (var i = 0; i < groups.length; i++) {
        if (groups[i] && (groups[i].name === name || groups[i].Name === name)) return groups[i];
      }
      return undefined;
    }
    if (groups && typeof groups === 'object' && groups[name] &&
        typeof groups[name] === 'object') return groups[name];
    return undefined;
  }
  function draw(data) {
    clear(target);
    runtime.textContent = data && data.runtime || '';
    logs.textContent = data && Array.isArray(data.logs) && data.logs.length ?
      data.logs.join('\n') : '<%:暂无日志%>';
    if (!data || data.error) {
      message.textContent = data && data.error || '<%:Smart 数据读取失败%>';
      return;
    }
    var weights = data.weights || {};
    var names = Object.keys(weights).sort();
    if (!names.length) {
      message.textContent = '<%:未找到 Smart 组。请检查内核及订阅配置。%>';
      return;
    }
    message.textContent = '<%:数据已更新。权重是相对排名，不是绝对速度。%>';
    names.forEach(function (name) {
      var info = groupInfo(data.groups, name);
      put(target, 'h3', name);
      if (info) {
        var current = field(info, ['now', 'Now', 'current', 'Current']) || '-';
        var members = field(info, ['members', 'Members', 'member_count', 'memberCount']) || 0;
        var fixed = field(info, ['fixed', 'Fixed', 'manual', 'Manual']);
        put(target, 'p', '<%:当前选择%>: ' + current +
          ' · <%:成员数%>: ' + members +
          (fixed ? ' · <%:手动固定%>' : ' · <%:智能选择%>'));
      }
      var rows = Array.isArray(weights[name]) ? weights[name] : [];
      if (!rows.length) {
        put(target, 'p', '<%:尚无节点数据%>');
        return;
      }
      var wrap = document.createElement('div');
      wrap.className = 'table';
      target.appendChild(wrap);
      var header = document.createElement('div');
      header.className = 'tr table-titles';
      wrap.appendChild(header);
      ['#', '<%:节点%>', '<%:权重/质量%>', '<%:状态%>', '<%:探测/响应%>', '<%:下载%>', '<%:成功/失败%>', '<%:稳定性%>'].forEach(function (x) {
        put(header, 'div', x, 'th');
      });
      rows.forEach(function (node, i) {
        var row = document.createElement('div');
        row.className = 'tr';
        wrap.appendChild(row);
        put(row, 'div', i + 1, 'td');
        put(row, 'div', field(node, ['Name', 'name']) || '-', 'td');
        var weight = number(node, ['Weight', 'weight', 'score']);
        var quality = number(node, ['Quality', 'quality']);
        put(row, 'div', (weight !== undefined ? weight.toFixed(1) : '-') +
          (quality !== undefined ? ' / ' + quality.toFixed(3) : ''), 'td');
        var alive = field(node, ['Alive', 'alive']);
        var backedOff = field(node, ['BackedOff', 'backedOff', 'backed_off']);
        var inPool = field(node, ['Pool', 'pool']);
        var status = alive === false ? '<%:离线%>' :
          backedOff ? '<%:退避中%>' :
          inPool ? '<%:候选池%>' : '<%:可用%>';
        put(row, 'div', status, 'td');
        var probe = measurement(number(node, ['ProbeMs', 'probeMs', 'probe_ms']), ' ms');
        var response = measurement(number(node, ['ResponseMs', 'responseMs', 'response_ms']), ' ms');
        put(row, 'div', probe + ' / ' + response, 'td');
        put(row, 'div', speed(number(node, ['DownloadBps', 'downloadBps', 'download_bps'])), 'td');
        var success = field(node, ['Success', 'success', 'sampleCount']) || 0;
        var failure = field(node, ['Failure', 'failure']) || 0;
        put(row, 'div', success + ' / ' + failure, 'td');
        var reliability = number(node, ['Reliability', 'reliability', 'stability']);
        var loss = number(node, ['Loss', 'loss']);
        put(row, 'div', reliability !== undefined ? reliability.toFixed(3) +
          (loss !== undefined ? ' / ' + (loss * 100).toFixed(2) + '%' : '') : '-', 'td');
      });
    });
  }
  function load() {
    button.disabled = true;
    message.textContent = '<%:正在读取...%>';
    fetch(endpoint, {credentials: 'same-origin', cache: 'no-store'})
      .then(function (res) { if (!res.ok) throw Error('HTTP ' + res.status); return res.json(); })
      .then(draw)
      .catch(function (e) { message.textContent = e.message; })
      .then(function () { button.disabled = false; });
  }
  button.addEventListener('click', load);
  load();
  window.setInterval(function () {
    if (!document.hidden && !button.disabled) load();
  }, 10000);
})();
</script>
<%+footer%>
