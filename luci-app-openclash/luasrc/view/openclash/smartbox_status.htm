<%+header%>
<h2><%:SmartBox - Smart 节点质量排名%></h2>
<p><%:独立测试模式：以下数据来自 sing-box Smart 内核，不会改变 OpenClash 当前线路。排名需要真实连接数据积累。%></p>
<div id="smartbox-message" role="status"><em><%:正在读取 Smart 排名...%></em></div>
<div id="smartbox-results"></div>
<p><button type="button" id="smartbox-refresh" class="btn cbi-button cbi-button-reload"><%:刷新排名%></button></p>
<script type="text/javascript">
(function () {
  'use strict';
  var endpoint = '<%=luci.dispatcher.build_url("admin","services","smartbox","status_data")%>';
  var message = document.getElementById('smartbox-message');
  var target = document.getElementById('smartbox-results');
  var button = document.getElementById('smartbox-refresh');
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function put(parent, tag, value, cls) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = value === undefined || value === null ? '-' : String(value);
    parent.appendChild(el);
    return el;
  }
  function measurement(v, suffix) {
    return typeof v === 'number' && isFinite(v) && v > 0 ? v.toFixed(1) + suffix : '-';
  }
  function speed(bps) {
    if (typeof bps !== 'number' || !isFinite(bps) || bps <= 0) return '-';
    return (bps / 1048576).toFixed(2) + ' MiB/s';
  }
  function draw(data) {
    clear(target);
    if (!data || data.error) {
      message.textContent = data && data.error || '<%:Smart 数据读取失败%>';
      return;
    }
    var weights = data.weights || {};
    var names = Object.keys(weights).sort();
    if (!names.length) {
      message.textContent = '<%:未找到 Smart 组。请检查内核及订阅配置。%>';
      return;
    }
    message.textContent = '<%:数据已更新。权重是相对排名，不是绝对速度。%>';
    names.forEach(function (name) {
      var info = (data.groups || []).filter(function (g) { return g && g.name === name; })[0];
      put(target, 'h3', name);
      if (info) {
        put(target, 'p', '<%:当前选择%>: ' + (info.now || '-') +
          ' · <%:成员数%>: ' + (info.members || 0) +
          (info.fixed ? ' · <%:手动固定%>' : ' · <%:智能选择%>'));
      }
      var rows = Array.isArray(weights[name]) ? weights[name] : [];
      if (!rows.length) {
        put(target, 'p', '<%:尚无节点数据%>');
        return;
      }
      var wrap = document.createElement('div');
      wrap.className = 'table';
      target.appendChild(wrap);
      var header = document.createElement('div');
      header.className = 'tr table-titles';
      wrap.appendChild(header);
      ['#', '<%:节点%>', '<%:权重%>', '<%:状态%>', '<%:响应%>', '<%:下载%>', '<%:成功/失败%>'].forEach(function (x) {
        put(header, 'div', x, 'th');
      });
      rows.forEach(function (node, i) {
        var row = document.createElement('div');
        row.className = 'tr';
        wrap.appendChild(row);
        put(row, 'div', i + 1, 'td');
        put(row, 'div', node.Name || '-', 'td');
        put(row, 'div', typeof node.Weight === 'number' ? node.Weight.toFixed(1) : '-', 'td');
        var status = !node.Alive ? '<%:离线%>' :
          node.BackedOff ? '<%:退避中%>' :
          node.Pool ? '<%:候选池%>' : '<%:可用%>';
        put(row, 'div', status, 'td');
        put(row, 'div', measurement(node.ResponseMs, ' ms'), 'td');
        put(row, 'div', speed(node.DownloadBps), 'td');
        put(row, 'div', (node.Success || 0) + ' / ' + (node.Failure || 0), 'td');
      });
    });
  }
  function load() {
    button.disabled = true;
    message.textContent = '<%:正在读取...%>';
    fetch(endpoint, {credentials: 'same-origin', cache: 'no-store'})
      .then(function (res) { if (!res.ok) throw Error('HTTP ' + res.status); return res.json(); })
      .then(draw)
      .catch(function (e) { message.textContent = e.message; })
      .then(function () { button.disabled = false; });
  }
  button.addEventListener('click', load);
  load();
})();
</script>
<%+footer%>
