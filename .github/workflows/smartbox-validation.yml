name: SmartBox adapter validation

on:
  push:
    branches: [feature/sing-box-smart-adapter]
    paths:
      - 'luci-app-openclash/luasrc/controller/smartbox*.lua'
      - 'luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua'
      - 'luci-app-openclash/root/etc/init.d/smartbox'
      - 'luci-app-openclash/root/usr/libexec/smartbox-*'
      - 'luci-app-openclash/luasrc/view/openclash/smartbox_status.htm'
      - '.github/workflows/smartbox-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Shell syntax
        run: |
          sh -n luci-app-openclash/root/etc/init.d/smartbox
          for f in luci-app-openclash/root/usr/libexec/smartbox-*; do sh -n "$f"; done
          sh -n luci-app-openclash/root/usr/libexec/smartbox-import-openclash-rules
      - name: Lua syntax
        run: |
          luac -p luci-app-openclash/luasrc/controller/smartbox.lua
          luac -p luci-app-openclash/luasrc/controller/smartbox_status.lua
          luac -p luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
      - name: JavaScript syntax of rendered LuCI page
        run: |
          awk '$0 ~ /<script type=/ {p=1; next} $0 ~ /<[/]script>/ {p=0} p {print}' \
            luci-app-openclash/luasrc/view/openclash/smartbox_status.htm > /tmp/smartbox-status.js
          test -s /tmp/smartbox-status.js
          node --check /tmp/smartbox-status.js
          grep -Fq "runtime.textContent ? '\\n'" luci-app-openclash/luasrc/view/openclash/smartbox_status.htm
      - name: Assert isolated default
        run: |
          grep -q "option enabled '0'" luci-app-openclash/root/etc/config/smartbox
          grep -q 'listen="127.0.0.1"' luci-app-openclash/root/usr/libexec/smartbox-generate
          ! grep -E 'iptables -|nft add|uci commit firewall|ip rule add' luci-app-openclash/root/etc/init.d/smartbox
          grep -q '/usr/libexec/smartbox-health' luci-app-openclash/root/usr/libexec/smartbox-start
          grep -q '/usr/libexec/smartbox-stop' luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
          grep -q 'type="tun"' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'action="resolve"' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'action="sniff"' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'source_ip_cidr' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'domain_suffix' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'smart-fakeip' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'Smart device policies' luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
          grep -q 'Smart domain policies' luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
          grep -q 'smartbox-import-openclash-rules' luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
          grep -q 'domain_keyword' luci-app-openclash/root/usr/libexec/smartbox-generate
          ! grep -q 'sniff_override_destination' luci-app-openclash/root/usr/libexec/smartbox-generate
          grep -q 'handover.active' luci-app-openclash/root/etc/init.d/smartbox
          grep -q 'requires smartbox-start handover' luci-app-openclash/root/etc/init.d/smartbox
          grep -q 'SmartBox global health check failed' luci-app-openclash/root/usr/libexec/smartbox-watchdog
          grep -q 'SmartBox global TUN is active' luci-app-openclash/root/etc/init.d/openclash
          grep -q 'SmartBox invalid-core rollback' .github/workflows/smartbox-vm.yml
