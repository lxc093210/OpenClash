name: SmartBox experimental IPK build

on:
  workflow_dispatch:
  push:
    branches: [feature/sing-box-smart-adapter]
    paths:
      - 'luci-app-openclash/Makefile'
      - '.github/workflows/smartbox-ipk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare OpenWrt SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk unzip file wget python3 rsync zstd
          wget -q https://downloads.openwrt.org/releases/24.10.3/targets/x86/64/openwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst -O /tmp/sdk.tar.zst
          echo '5e189d938c2320c4c86a9565133970436a7ddf684ef8d01ee1c18c561c4ed643  /tmp/sdk.tar.zst' | sha256sum -c -
          mkdir -p /tmp/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp/sdk --strip-components=1
      - name: Import package source
        run: |
          mkdir -p /tmp/sdk/package/smartbox
          cp -a luci-app-openclash/. /tmp/sdk/package/smartbox/
          # Build in the SDK workspace; this does not publish or install the result.
      - name: Configure
        run: |
          cd /tmp/sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf 'CONFIG_PACKAGE_luci-app-openclash=m\n' >> .config
          make defconfig
      - name: Build OpenClash translation compiler
        run: |
          make -C /tmp/sdk/package/smartbox/tools/po2lmo
          sudo install -m 0755 /tmp/sdk/package/smartbox/tools/po2lmo/src/po2lmo /usr/local/bin/po2lmo
          command -v po2lmo
      - name: Compile package
        run: |
          cd /tmp/sdk
          # OpenWrt's Rust host bootstrap misidentifies third-party GitHub
          # runners as rust-lang's own CI (openwrt/packages#26623).
          # Do not change the globally visible GitHub Actions environment.
          env -u GITHUB_ACTIONS -u CI make package/smartbox/compile V=s -j2
      - name: Find IPK
        run: |
          find /tmp/sdk/bin/packages -name '*openclash*.ipk' -print
          find /tmp/sdk/bin/packages -name '*openclash*.ipk' -print -quit | grep -q .
      - name: Inspect package payload
        run: |
          set -eu
          IPK="$(find /tmp/sdk/bin/packages -type f -name 'luci-app-openclash*.ipk' -print -quit)"
          [ -n "$IPK" ] || exit 1
          mkdir -p /tmp/smartbox-inspect
          cd /tmp/smartbox-inspect
          # OpenWrt packages may be gzip-tar IPKs rather than ar archives.
          if ar t "$IPK" >/dev/null 2>&1; then
            ar x "$IPK"
          else
            tar -xf "$IPK"
          fi
          DATA="$(find . -maxdepth 1 -name 'data.tar.*' -print -quit)"
          [ -n "$DATA" ] || { echo 'Missing data archive'; exit 1; }
          tar -tf "$DATA" > /tmp/smartbox-manifest.txt
          for file in \
            etc/config/smartbox \
            etc/init.d/smartbox \
            usr/libexec/smartbox-generate \
            usr/libexec/smartbox-core-install \
            usr/lib/lua/luci/controller/smartbox.lua \
            usr/lib/lua/luci/view/openclash/smartbox_status.htm; do
            grep -Eq "^((\\./)?)$file$" /tmp/smartbox-manifest.txt || {
              echo "Missing expected package file: $file"
              exit 1
            }
          done
          echo "SmartBox package files verified"
      - uses: actions/upload-artifact@v4
        with:
          name: smartbox-openwrt-x86-64-ipk-experimental
          path: /tmp/sdk/bin/packages/**/*openclash*.ipk
          if-no-files-found: error
