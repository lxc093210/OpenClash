name: SmartBox experimental IPK build

on:
  workflow_dispatch:
    inputs:
      vm_smoke:
        description: 'Install and test IPK in an isolated OpenWrt VM'
        type: boolean
        default: false
  push:
    branches: [feature/sing-box-smart-adapter]
    paths:
      - 'luci-app-openclash/**'
      - '.github/workflows/smartbox-ipk.yml'
      - '.github/workflows/smartbox-vm.yml'

permissions:
  contents: read

concurrency:
  group: smartbox-ipk-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_RELEASE: '24.10.3'
  SDK_URL: 'https://downloads.openwrt.org/releases/24.10.3/targets/x86/64/openwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst'
  SDK_SHA256: '5e189d938c2320c4c86a9565133970436a7ddf684ef8d01ee1c18c561c4ed643'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk unzip file wget python3 rsync zstd lua5.1 lua-cjson meson ninja-build pkg-config libssl-dev liblua5.1-0-dev
          wget -q --https-only --retry-connrefused --tries=3 "$SDK_URL" -O /tmp/sdk.tar.zst
          printf '%s  %s\n' "$SDK_SHA256" /tmp/sdk.tar.zst | sha256sum -c -
          mkdir -p /tmp/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp/sdk --strip-components=1

      - name: Import package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk/package/smartbox
          cp -a luci-app-openclash/. /tmp/sdk/package/smartbox/

      - name: Update matching release feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk
          # These are the feed commits recorded by OpenWrt v24.10.3. Using
          # moving feed HEAD can mix incompatible Rust/Ruby build systems
          # into a release SDK.
          printf '%s\n' \
            'src-git packages https://github.com/openwrt/packages.git^44cff71992c291ae11b7b37606c70db62dc0674e' \
            'src-git luci https://github.com/openwrt/luci.git^923f8d991a49dc3d899fd24fc92ae7b1653ee4d0' \
            'src-git routing https://github.com/openwrt/routing.git^885ae6f9d0c0f47a1a6321e1cc7e9c7e20cc2681' \
            'src-git telephony https://github.com/openwrt/telephony.git^2a4541d46199ac96fac214d02c908402831c4dc6' \
            > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch release feed recipes
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk

          # The v24.10.3 Rust recipe requests a CI LLVM bundle. That URL is
          # not available for this compiler tuple anymore. OpenWrt's newer
          # recipe builds LLVM locally, which is the compatible fallback.
          rust_makefile=feeds/packages/lang/rust/Makefile
          test -f "$rust_makefile" || {
            echo "Rust recipe not found at $rust_makefile" >&2
            find feeds -path '*/rust/Makefile' -print >&2
            exit 1
          }
          sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' "$rust_makefile"
          grep -q -- '--set=llvm.download-ci-llvm=false' "$rust_makefile" || {
            echo 'Rust recipe still requests CI LLVM' >&2
            grep -n 'download-ci-llvm' "$rust_makefile" >&2 || true
            exit 1
          }

          # Ruby's YJIT is not used by OpenClash. Remove the conditional host
          # dependency as a second guard: some SDK defconfig combinations
          # enable the symbol after package metadata is re-evaluated.
          ruby_makefile=feeds/packages/lang/ruby/Makefile
          test -f "$ruby_makefile" || {
            echo "Ruby recipe not found at $ruby_makefile" >&2
            find feeds -path '*/ruby/Makefile' -print >&2
            exit 1
          }
          sed -i 's/PKG_BUILD_DEPENDS:=ruby\/host RUBY_ENABLE_YJIT:rust\/host/PKG_BUILD_DEPENDS:=ruby\/host/' "$ruby_makefile"
          if grep -n 'rust/host' "$ruby_makefile"; then
            echo 'Ruby recipe still contains a rust/host dependency' >&2
            exit 1
          fi
          # feeds install normally creates a symlink, but handle SDKs that
          # materialize the package under package/feeds as well.
          installed_ruby_makefile=package/feeds/packages/ruby/Makefile
          if [ -f "$installed_ruby_makefile" ]; then
            sed -i 's/PKG_BUILD_DEPENDS:=ruby\/host RUBY_ENABLE_YJIT:rust\/host/PKG_BUILD_DEPENDS:=ruby\/host/' "$installed_ruby_makefile"
            if grep -n 'rust/host' "$installed_ruby_makefile"; then
              echo 'Installed Ruby recipe still contains a rust/host dependency' >&2
              exit 1
            fi
          fi

          printf '%s\n' 'Patched Rust and Ruby recipes:'
          grep -n 'download-ci-llvm' "$rust_makefile" || true
          grep -n 'PKG_BUILD_DEPENDS' "$ruby_makefile" || true

      - name: Seed SDK package selection
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk

          printf 'CONFIG_PACKAGE_luci-app-openclash=m\n' >> .config
          printf 'CONFIG_PACKAGE_rust=n\n' >> .config
          # OpenClash needs Ruby/YAML at runtime, but not Ruby's optional
          # YJIT. Keeping this disabled also avoids the rust/host dependency.
          printf 'CONFIG_RUBY_ENABLE_YJIT=n\n' >> .config

      - name: Resolve SDK package configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk
          make defconfig

      - name: Verify SDK package configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk
          if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y$' .config; then
            echo 'Ruby YJIT unexpectedly enabled' >&2
            grep -n 'RUBY_ENABLE_YJIT' .config >&2 || true
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_rust=[ym]$' .config; then
            echo 'Rust target package unexpectedly selected' >&2
            grep -n '^CONFIG_PACKAGE_rust=' .config >&2 || true
            exit 1
          fi
          printf '%s\n' 'Resolved package configuration:'
          grep -E '^(CONFIG_PACKAGE_luci-app-openclash|CONFIG_RUBY_ENABLE_YJIT|CONFIG_PACKAGE_rust)' .config || true

      - name: Build OpenClash translation compiler
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/sdk/package/smartbox/tools/po2lmo
          sudo install -m 0755 /tmp/sdk/package/smartbox/tools/po2lmo/src/po2lmo /usr/local/bin/po2lmo
          command -v po2lmo

      - name: Check SmartBox Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p luci-app-openclash/luasrc/controller/smartbox.lua
          luac5.1 -p luci-app-openclash/luasrc/controller/smartbox_status.lua
          luac5.1 -p luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
          for script in luci-app-openclash/root/usr/libexec/smartbox-*; do
            sh -n "$script"
          done
          sed -n "/^lua - <<'LUA'$/,/^LUA$/p" \
            luci-app-openclash/root/usr/libexec/smartbox-generate |
            sed '1d;$d' | luac5.1 -p -
          LUA_PATH="$GITHUB_WORKSPACE/tests/lua/?.lua;$GITHUB_WORKSPACE/tests/lua/?/init.lua;;" \
            lua5.1 tests/lua/status_test.lua \
            luci-app-openclash/luasrc/controller/smartbox_status.lua

      - name: Compile package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sdk
          # This package contains scripts and LuCI assets, with no target ELF
          # linkage. The SDK omits core source recipes such as ncurses, so a
          # top-level dependency rebuild cannot link bash. Build the package
          # through OpenWrt's package.mk directly; runtime dependencies stay
          # recorded in the generated IPK control metadata.
          make -C package/smartbox TOPDIR=/tmp/sdk compile V=s -j1

      - name: Validate Smart config with pinned core
        shell: bash
        run: |
          set -euo pipefail
          version=1.15.0-alpha.13-xiaobaf14g.8
          name="sing-box-$version-linux-amd64"
          curl -fLSs --retry 2 \
            "https://github.com/MiChongs/sing-box/releases/download/v$version/$name.tar.gz" \
            -o /tmp/sing-box-smart.tar.gz
          printf '%s  %s\n' \
            99f92c1e4ea3f58b3af9a5f2c991cbf86b0e8ef812f428a859ec0415d967573d \
            /tmp/sing-box-smart.tar.gz | sha256sum -c -
          tar -xOzf /tmp/sing-box-smart.tar.gz "$name" > /tmp/sing-box-smart
          chmod 0755 /tmp/sing-box-smart
          /tmp/sing-box-smart check -c "$GITHUB_WORKSPACE/tests/smartbox-local.json"

      - name: Test generated Smart config
        shell: bash
        run: |
          set -euo pipefail
          export LUA_PATH="$GITHUB_WORKSPACE/tests/lua/?.lua;$GITHUB_WORKSPACE/tests/lua/?/init.lua;;"
          export CANDIDATE=/tmp/smartbox-generated.json
          sed -n "/^lua - <<'LUA'$/,/^LUA$/p" \
            luci-app-openclash/root/usr/libexec/smartbox-generate |
            sed '1d;$d' > /tmp/smartbox-generator.lua
          lua5.1 /tmp/smartbox-generator.lua
          python3 -c 'import json; x=json.load(open("/tmp/smartbox-generated.json")); assert len(x["providers"]) == 2; assert x["outbounds"][0]["providers"] == ["first", "second"]'
          /tmp/sing-box-smart check -c "$CANDIDATE"
          if SMARTBOX_TEST_COLLISION=1 lua5.1 /tmp/smartbox-generator.lua > /tmp/smartbox-invalid.log 2>&1; then
            echo 'Generator accepted overlapping local ports' >&2
            exit 1
          fi
          grep -q 'proxy and controller ports must differ' /tmp/smartbox-invalid.log

      - name: Find IPK
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/sdk/bin/packages -type f -name '*openclash*.ipk' -print
          find /tmp/sdk/bin/packages -type f -name '*openclash*.ipk' -print -quit | grep -q .

      - name: Inspect package payload
        shell: bash
        run: |
          set -euo pipefail
          IPK="$(find /tmp/sdk/bin/packages -type f -name 'luci-app-openclash*.ipk' -print -quit)"
          [ -n "$IPK" ]
          mkdir -p /tmp/smartbox-inspect
          cd /tmp/smartbox-inspect
          if ar t "$IPK" >/dev/null 2>&1; then
            ar x "$IPK"
          else
            tar -xf "$IPK"
          fi
          CONTROL="$(find . -maxdepth 1 -name 'control.tar.*' -print -quit)"
          [ -n "$CONTROL" ]
          depends="$(tar -xOf "$CONTROL" ./control | sed -n 's/^Depends: //p')"
          for dep in luci-compat dnsmasq-full bash curl ca-bundle ip-full ruby ruby-yaml ruby-ipaddr kmod-tun unzip; do
            printf '%s\n' "$depends" | grep -Eq "(^|[ ,])${dep}([ ,(]|$)" || {
              echo "Missing runtime dependency: $dep" >&2
              exit 1
            }
          done
          for config in /etc/config/openclash /etc/config/smartbox; do
            tar -xOf "$CONTROL" ./conffiles | grep -Fx "$config"
          done
          for script in preinst postinst-pkg prerm-pkg postrm; do
            tar -xOf "$CONTROL" "./$script" | sh -n
          done
          tar -xOf "$CONTROL" ./postinst-pkg | grep -F 'if [ -z "$IPKG_INSTROOT" ]'
          tar -xOf "$CONTROL" ./prerm-pkg | grep -F 'pidof clash'
          tar -xOf "$CONTROL" ./prerm-pkg | grep -F '[ -z "$IPKG_INSTROOT" ]'
          tar -xOf "$CONTROL" ./prerm-pkg | grep -F '/etc/init.d/smartbox stop'
          tar -xOf "$CONTROL" ./postrm | grep -F 'split($0, conf'
          tar -xOf "$CONTROL" ./postrm | grep -F 'print $2'
          tar -xOf "$CONTROL" ./postrm | grep -F '${DNSMASQ_CONF_DIR}/dnsmasq_openclash_custom_domain.conf'
          if tar -xOf "$CONTROL" ./postrm | grep -Eq 'rm -rf /etc/(config/openclash|openclash)'; then
            echo 'Package removal would delete OpenClash user configuration' >&2
            exit 1
          fi
          DATA="$(find . -maxdepth 1 -name 'data.tar.*' -print -quit)"
          [ -n "$DATA" ]
          tar -tf "$DATA" > /tmp/smartbox-manifest.txt
          for file in \
            etc/config/smartbox \
            etc/init.d/smartbox \
            usr/libexec/smartbox-generate \
            usr/libexec/smartbox-core-install \
            usr/libexec/smartbox-health \
            usr/libexec/smartbox-start \
            usr/libexec/smartbox-stop \
            usr/libexec/smartbox-switch \
            usr/libexec/smartbox-watchdog \
            usr/lib/lua/luci/controller/smartbox.lua \
            usr/lib/lua/luci/view/openclash/smartbox_status.htm \
            usr/share/rpcd/acl.d/luci-app-openclash.json \
            usr/share/licenses/luci-app-openclash/LICENSE; do
            grep -Eq "^((\\./)?)$file$" /tmp/smartbox-manifest.txt || {
              echo "Missing expected package file: $file" >&2
              exit 1
            }
          done
          tar -xOf "$DATA" ./usr/share/rpcd/acl.d/luci-app-openclash.json |
            grep -F '"smartbox"' >/dev/null
          tar -tvf "$DATA" | awk '
            $NF == "./etc/init.d/smartbox" || $NF == "./usr/libexec/smartbox-generate" ||
            $NF == "./usr/libexec/smartbox-core-install" || $NF == "./usr/libexec/smartbox-core-rollback" ||
            $NF == "./usr/libexec/smartbox-health" || $NF == "./usr/libexec/smartbox-start" ||
            $NF == "./usr/libexec/smartbox-stop" || $NF == "./usr/libexec/smartbox-switch" ||
            $NF == "./usr/libexec/smartbox-watchdog" {
              if ($1 != "-rwxr-xr-x") exit 1
              count++
            }
            END { if (count != 9) exit 1 }
          '
          echo 'SmartBox package files verified'

      - uses: actions/upload-artifact@v4
        with:
          name: smartbox-openwrt-x86-64-ipk-experimental
          path: /tmp/sdk/bin/packages/**/*openclash*.ipk
          if-no-files-found: error

  vm-smoke:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.vm_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vm-smoke]')) }}
    needs: build
    uses: ./.github/workflows/smartbox-vm.yml
    permissions:
      contents: read
      actions: read

  # ImmortalWrt 25.12 and OpenWrt 25.12 use APK v3 instead of the IPK
  # format used by the 24.10 SDK above. Keep a release-pinned APK build so
  # users on the newer package manager can upgrade an existing OpenClash
  # installation without mixing package formats.
  build-immortalwrt-25-12-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare OpenWrt 25.12.2 SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk unzip file wget python3 rsync zstd lua5.1 lua-cjson
          sdk_url='https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
          sdk_sha256='4abb32a6dd05f80c24fc1a487a94b1f5f0a5d4cd560ff3dd8c1bf77793a2d5dc'
          wget -q --https-only --retry-connrefused --tries=3 "$sdk_url" -O /tmp/sdk-25.12.tar.zst
          printf '%s  %s\n' "$sdk_sha256" /tmp/sdk-25.12.tar.zst | sha256sum -c -
          mkdir -p /tmp/sdk-25.12
          tar --zstd -xf /tmp/sdk-25.12.tar.zst -C /tmp/sdk-25.12 --strip-components=1

      - name: Import package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk-25.12/package/smartbox
          cp -a luci-app-openclash/. /tmp/sdk-25.12/package/smartbox/

      - name: Update SDK release feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk-25.12
          # The release SDK carries the matching 25.12 feed branches. Keep
          # those URLs rather than resolving moving master feeds.
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed and resolve APK SDK configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/sdk-25.12
          printf 'CONFIG_PACKAGE_luci-app-openclash=m\n' >> .config
          printf 'CONFIG_PACKAGE_rust=n\n' >> .config
          printf 'CONFIG_RUBY_ENABLE_YJIT=n\n' >> .config
          make defconfig
          if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y$' .config; then
            echo 'Ruby YJIT unexpectedly enabled' >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_rust=[ym]$' .config; then
            echo 'Rust target package unexpectedly selected' >&2
            exit 1
          fi

      - name: Build OpenClash translation compiler
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/sdk-25.12/package/smartbox/tools/po2lmo
          sudo install -m 0755 /tmp/sdk-25.12/package/smartbox/tools/po2lmo/src/po2lmo /usr/local/bin/po2lmo
          command -v po2lmo

      - name: Check SmartBox source
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p luci-app-openclash/luasrc/controller/smartbox.lua
          luac5.1 -p luci-app-openclash/luasrc/controller/smartbox_status.lua
          luac5.1 -p luci-app-openclash/luasrc/model/cbi/openclash/smartbox.lua
          for script in luci-app-openclash/root/usr/libexec/smartbox-*; do sh -n "$script"; done

      - name: Compile APK package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sdk-25.12
          make -C package/smartbox TOPDIR=/tmp/sdk-25.12 compile V=s -j1

      - name: Inspect APK payload
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find /tmp/sdk-25.12/bin/packages -type f -name 'luci-app-openclash*.apk' -print -quit)"
          [ -n "$apk_path" ]
          file "$apk_path"
          size="$(stat -c '%s' "$apk_path")"
          [ "$size" -gt 1024 ] || { echo 'APK artifact is unexpectedly small' >&2; exit 1; }
          magic="$(od -An -tx1 -N3 "$apk_path" | tr -d '[:space:]')"
          [ "$magic" = '414442' ] || {
            echo "Unexpected APK v3 magic: $magic" >&2
            exit 1
          }
          echo "ImmortalWrt/OpenWrt 25.12 APK v3 artifact verified ($size bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: smartbox-immortalwrt-25-12-x86-64-apk-experimental
          path: /tmp/sdk-25.12/bin/packages/**/*openclash*.apk
          if-no-files-found: error

      # Publish the first verified 25.12 test package so an APK-compatible
      # target can install it without requiring an authenticated artifact URL.
      # The commit guard keeps this one-time handoff from publishing every build.
      - name: Publish verified APK test release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'publish verified 25.12 APK')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find /tmp/sdk-25.12/bin/packages -type f -name 'luci-app-openclash*.apk' -print -quit)"
          tag='smartbox-apk-25.12.2-x86-64'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_path" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'OpenClash SmartBox 25.12 APK experimental' \
              --prerelease \
              --notes 'Experimental APK for ImmortalWrt/OpenWrt 25.12 x86_64. Keep SmartBox disabled until local validation is complete.'
          fi
