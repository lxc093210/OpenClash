name: SmartBox isolated OpenWrt VM smoke

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful SmartBox IPK workflow run containing the artifact'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact from caller workflow
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: smartbox-openwrt-x86-64-ipk-experimental
          path: /tmp/smartbox-artifact

      - name: Download artifact from a verified build run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: smartbox-openwrt-x86-64-ipk-experimental
          path: /tmp/smartbox-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare isolated OpenWrt 24.10.3 VM
        run: |
          set -euxo pipefail
          trap 'rc=$?; echo "::error title=VM preparation failed::line ${LINENO}, exit ${rc}"; exit "$rc"' ERR
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils parted e2fsprogs
          image=openwrt-24.10.3-x86-64-generic-ext4-combined.img.gz
          curl -fLSs --retry 2 \
            "https://downloads.openwrt.org/releases/24.10.3/targets/x86/64/$image" \
            -o "/tmp/$image"
          printf '%s  %s\n' \
            cc621a8a8a2b780d3c8f47ce3ecb2ba59e4a0cff1ebeb8d096d7c7e0202799c7 \
            "/tmp/$image" | sha256sum -c -
          magic="$(od -An -tx1 -N2 "/tmp/$image" | tr -d '[:space:]')"
          [ "$magic" = "1f8b" ] || { echo "::error title=Unexpected OpenWrt image header::magic $magic"; exit 1; }
          if ! python3 -c 'import sys, zlib; source = open(sys.argv[1], "rb"); payload = zlib.decompress(source.read(), 31); source.close(); target = open("/tmp/openwrt.img", "wb"); target.write(payload); target.close()' "/tmp/$image" 2>/tmp/image-decompress.err; then
            error="$(tr '\n' ' ' </tmp/image-decompress.err)"
            echo "::error title=OpenWrt image decompression failed::$error"
            exit 1
          fi
          qemu-img resize /tmp/openwrt.img 1G
          # qemu-img only grows the disk container. Expand the ext4 root
          # partition and filesystem as well so the pinned Smart core can be
          # installed in the disposable VM's writable root filesystem.
          loopdev="$(sudo losetup --find --show --partscan /tmp/openwrt.img)"
          sudo parted -s "$loopdev" resizepart 2 100%
          sudo partprobe "$loopdev" || true
          rootdev="${loopdev}p2"
          [ -b "$rootdev" ] || { echo "::error title=OpenWrt root partition missing::$rootdev"; exit 1; }
          fsck_rc=0
          sudo e2fsck -fy "$rootdev" || fsck_rc=$?
          [ "$fsck_rc" -le 1 ] || {
            echo "::error title=OpenWrt root filesystem check failed::exit $fsck_rc"
            exit "$fsck_rc"
          }
          sudo resize2fs "$rootdev"
          sudo losetup -d "$loopdev"
          sudo mkdir -p /mnt/smartbox-openwrt
          # The verified 24.10.3 combined image has its ext4 rootfs at sector
          # 33792. Mount the existing partition directly so this smoke test
          # does not depend on privileged loop partition node creation.
          root_offset=$((33792 * 512))
          sudo mount -o loop,offset="$root_offset" /tmp/openwrt.img /mnt/smartbox-openwrt
          if [ -f /mnt/smartbox-openwrt/etc/config/network ]; then
            sudo sed -i "/config interface 'lan'/,/^$/s/option proto 'static'/option proto 'dhcp'/" \
              /mnt/smartbox-openwrt/etc/config/network
            grep -A5 "config interface 'lan'" /mnt/smartbox-openwrt/etc/config/network |
              grep -F "option proto 'dhcp'"
          else
            echo "No preseeded network UCI file; creating a DHCP LAN for QEMU user networking"
            sudo tee /mnt/smartbox-openwrt/etc/config/network >/dev/null <<'EOF'
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'eth0'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'dhcp'
          EOF
          fi
          ssh-keygen -q -t ed25519 -N '' -f /tmp/smartbox-vm-key
          sudo install -d -m 0700 /mnt/smartbox-openwrt/etc/dropbear
          sudo install -m 0600 /tmp/smartbox-vm-key.pub \
            /mnt/smartbox-openwrt/etc/dropbear/authorized_keys
          sudo umount /mnt/smartbox-openwrt

      - name: Boot VM and install package
        run: |
          set -euxo pipefail
          trap 'rc=$?; echo "::error title=VM boot/install failed::line ${LINENO}, exit ${rc}"; exit "$rc"' ERR
          ipk="$(find /tmp/smartbox-artifact -name 'luci-app-openclash*.ipk' -print -quit)"
          [ -n "$ipk" ] || { echo "::error title=SmartBox IPK artifact missing::$(find /tmp/smartbox-artifact -maxdepth 2 -type f 2>&1 | tr '\n' ' ')"; exit 1; }
          ipk_name="$(basename "$ipk")"
          (cd "$(dirname "$ipk")" && python3 -m http.server 8000 --bind 0.0.0.0 >/tmp/smartbox-http.log 2>&1 & echo $! >/tmp/smartbox-http.pid)
          qemu-system-x86_64 -m 1024 -smp 2 \
            -drive file=/tmp/openwrt.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -serial file:/tmp/openwrt-serial.log \
            -daemonize -pidfile /tmp/openwrt-qemu.pid
          ssh_opts=(-i /tmp/smartbox-vm-key -p 2222 -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=3)
          ready=0
          for attempt in $(seq 1 90); do
            if ssh "${ssh_opts[@]}" root@127.0.0.1 'echo ready' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 100 /tmp/openwrt-serial.log
            echo 'OpenWrt VM did not accept SSH' >&2
            exit 1
          fi
          ssh "${ssh_opts[@]}" root@127.0.0.1 \
            "wget -q -O /tmp/smartbox.ipk http://10.0.2.2:8000/$ipk_name"
          ssh "${ssh_opts[@]}" root@127.0.0.1 'opkg update >/tmp/opkg-update.log 2>&1 || { echo "::error title=OpenWrt opkg update failed::$(tr '\''\n'\'' '\'' '\'' </tmp/opkg-update.log)"; exit 1; }'
          ssh "${ssh_opts[@]}" root@127.0.0.1 'opkg remove dnsmasq >/tmp/opkg-dnsmasq.log 2>&1 || { echo "::error title=OpenWrt dnsmasq replacement failed::$(tr '\''\n'\'' '\'' '\'' </tmp/opkg-dnsmasq.log)"; exit 1; }'
          ssh "${ssh_opts[@]}" root@127.0.0.1 'opkg install luci >/tmp/opkg-luci.log 2>&1 || { echo "::error title=OpenWrt LuCI install failed::$(tr '\''\n'\'' '\'' '\'' </tmp/opkg-luci.log)"; exit 1; }'
          ssh "${ssh_opts[@]}" root@127.0.0.1 'opkg install /tmp/smartbox.ipk >/tmp/opkg-smartbox.log 2>&1 || { echo "::error title=SmartBox IPK install failed::$(tr '\''\n'\'' '\'' '\'' </tmp/opkg-smartbox.log)"; exit 1; }'
          ssh "${ssh_opts[@]}" root@127.0.0.1 'sh -s' <<'GUEST'
          set -eux
          trap 'rc=$?; echo "::error title=Guest SmartBox smoke failed::line ${LINENO}, exit ${rc}"; exit "$rc"' ERR
          opkg status luci-app-openclash | grep -E '^Status: install .* installed$'
          test -x /etc/init.d/smartbox
          test -x /usr/libexec/smartbox-generate
          test -f /usr/lib/lua/luci/controller/smartbox.lua
          test -f /usr/share/licenses/luci-app-openclash/LICENSE
          grep -F '"smartbox"' /usr/share/rpcd/acl.d/luci-app-openclash.json
          mode_line="$(ls -l /etc/config/smartbox)"
          case "$mode_line" in
            '-rw-------'*) ;;
            *) echo "::error title=SmartBox config mode mismatch::$mode_line"; exit 1 ;;
          esac
          uci show openclash > /tmp/openclash.before
          uci show dhcp > /tmp/dhcp.before
          uci show firewall > /tmp/firewall.before
          ip route show > /tmp/routes.before
          if ! /usr/libexec/smartbox-core-install >/tmp/smartbox-core-install.log 2>&1; then
            core_error="$(tail -n 12 /tmp/smartbox-core-install.log | tr '\n' ' ')"
            echo "::error title=Smart core installation failed::$core_error"
            cat /tmp/smartbox-core-install.log
            exit 1
          fi
          cp -p /usr/bin/sing-box-smart /etc/sing-box-smart/sing-box-smart.previous
          /usr/libexec/smartbox-core-rollback
          /usr/bin/sing-box-smart version | grep -F '1.15.0-alpha.13-xiaobaf14g.8'
          /usr/libexec/smartbox-core-install
          /usr/libexec/smartbox-secret-init
          if ! uci set smartbox.smoke=provider 2>/tmp/uci-set.err; then
            echo "::error title=SmartBox provider section write failed::$(tr '\n' ' ' </tmp/uci-set.err)"; exit 1
          fi
          if ! uci set smartbox.smoke.enabled=1 2>/tmp/uci-set.err; then
            echo "::error title=SmartBox provider enabled write failed::$(tr '\n' ' ' </tmp/uci-set.err) state=$(uci show smartbox 2>&1 | tr '\n' ' ')"; exit 1
          fi
          uci set smartbox.smoke.name=smoke
          uci set smartbox.smoke.url=https://example.invalid/subscription
          uci commit smartbox
          /usr/libexec/smartbox-generate
          uci set smartbox.main.enabled=1
          uci commit smartbox
          /etc/init.d/smartbox start
          sleep 5
          pidof sing-box-smart
          secret="$(uci -q get smartbox.main.api_secret)"
          curl -fsS --max-time 5 -H "Authorization: Bearer $secret" \
            http://127.0.0.1:19090/smart/groups | grep -F 'groups'
          /etc/init.d/smartbox stop
          uci show openclash > /tmp/openclash.after
          uci show dhcp > /tmp/dhcp.after
          uci show firewall > /tmp/firewall.after
          ip route show > /tmp/routes.after
          cmp /tmp/openclash.before /tmp/openclash.after
          cmp /tmp/dhcp.before /tmp/dhcp.after
          cmp /tmp/firewall.before /tmp/firewall.after
          cmp /tmp/routes.before /tmp/routes.after
          GUEST

      - name: Shut down isolated VM
        if: always()
        run: |
          if [ -f /tmp/openwrt-qemu.pid ]; then
            kill "$(cat /tmp/openwrt-qemu.pid)" || true
          fi
          if [ -f /tmp/smartbox-http.pid ]; then
            kill "$(cat /tmp/smartbox-http.pid)" || true
          fi
